<!DOCTYPE html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab05 - Infographic và Video</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
            text-align: center;
            background-color: #f4f6f8;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .video {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-top: 20px;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 8px;
        }

        footer {
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Infographic và Video minh họa</h1>

        <p>
            Trang web giới thiệu infographic kèm video YouTube,
            giúp người xem tiếp cận nội dung trực quan và sinh động hơn.
        </p>

        <h2>Infographic</h2>
        <img
            src="Lab05_Ex2.1.png"
            alt="Infographic Lab05 Ex2.1"
        >

        <h2>Video YouTube</h2>
        <div class="video">
            <iframe
                src="https://www.youtube.com/embed/GqvEsTFtifk"
                title="Video YouTube"
                allowfullscreen>
            </iframe>
        </div>

        <footer>
            © 2026 - Nội dung được thực hiện bởi GitHub Copilot.
        </footer>
    </main>
</body>
</html>
